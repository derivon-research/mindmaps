<h1>共模反馈环</h1>
<p>共模反馈环依次完成输出平均值感知、差分分量抵消和偏置控制注入，使输出共模收敛到参考值。它对共模通道通常是单位增益闭环，因此稳定性要求严格。</p>
<p>CMFB 环路增益也提高共模抑制比，但其直流参考精度通常不需要达到差分增益精度。</p>
<p>来源：第 8 章 pp. 241-243，085-088。</p>
